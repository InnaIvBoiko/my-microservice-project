apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-django
spec:
  replicas: {{ .Values.autoscaler.minReplicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-django
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-django
    spec:
      containers:
        - name: django
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret | default (printf "%s-secret" .Release.Name) }}
                  key: POSTGRES_PASSWORD
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret | default (printf "%s-secret" .Release.Name) }}
                  key: DJANGO_SECRET_KEY
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Liveness: /health/ returns 200 without hitting the DB —
          # restarts the pod only when Django itself has crashed.
          livenessProbe:
            httpGet:
              path: /health/
              port: {{ .Values.service.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: /admin/ does a 302 redirect (< 400, counts as success) and
          # exercises the DB connection — keeps the pod out of rotation until ready.
          readinessProbe:
            httpGet:
              path: /admin/
              port: {{ .Values.service.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
