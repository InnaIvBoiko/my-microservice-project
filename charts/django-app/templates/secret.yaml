{{- if not .Values.secret.existingSecret }}
# Only rendered when secret.existingSecret is unset — production deploys should set
# secret.existingSecret to a Secret created out-of-band (e.g. by Terraform) so real
# credentials never sit in a git-committed values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | quote }}
  DJANGO_SECRET_KEY: {{ .Values.secret.djangoSecretKey | quote }}
{{- end }}
