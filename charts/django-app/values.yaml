image:
  repository: "740948698725.dkr.ecr.us-west-2.amazonaws.com/final-project-ecr"
  tag: v1.0.5
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80           # external port exposed by the LoadBalancer
  containerPort: 8000 # internal port Django listens on

ingress:
  enabled: false

autoscaler:
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

secret:
  # Real credentials live in the "django-app-secret" Kubernetes Secret, created by
  # Terraform (see kubernetes_secret_v1.django_app_secret in main.tf) — never in this
  # git-committed file. Leave postgresPassword/djangoSecretKey empty below; they're
  # only used as a local-dev fallback when existingSecret is unset.
  existingSecret: "django-app-external-secret"
  postgresPassword: ""
  djangoSecretKey: ""

config:
  DEBUG: "False"
  ALLOWED_HOSTS: "*" # kubelet liveness/readiness probes hit the pod via its IP as Host header; "*" is fine for this demo (DEBUG=False keeps error pages safe)
  POSTGRES_HOST: "myapp-db.cro6wuesev0n.us-west-2.rds.amazonaws.com"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_DB: myapp
