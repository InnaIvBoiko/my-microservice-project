grafana:
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

  service:
    type: ClusterIP
    port: 80

  persistence:
    enabled: true
    storageClassName: "${storage_class}"
    size: 5Gi

  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"

  # Kubernetes cluster/pod dashboards ship out of the box — no manual import needed
  defaultDashboardsEnabled: true

prometheus:
  service:
    type: ClusterIP

  prometheusSpec:
    retention: 7d
    resources:
      limits:
        cpu: "1000m"
        memory: "1Gi"
      requests:
        cpu: "250m"
        memory: "512Mi"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "${storage_class}"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  service:
    type: ClusterIP

  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "${storage_class}"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# node-exporter and kube-state-metrics are enabled by default in this chart
# and provide the node/pod metrics behind the Grafana dashboards above.
